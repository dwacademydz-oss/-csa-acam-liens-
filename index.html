<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSA ACAM — Liens officiels</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #142d63; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #f6f9ff, #e9effb); }
    main { width: min(100%, 440px); padding: 34px 24px 26px; text-align: center; background: #fff; border: 1px solid #e2e8f5; border-radius: 24px; box-shadow: 0 15px 45px rgba(20,45,99,.15); }
    .logo { width: 118px; height: 138px; margin: 0 auto 16px; display: block; object-fit: contain; }
    h1 { margin: 0; font-size: 26px; }
    .subtitle { margin: 8px 0 25px; color: #687794; font-size: 15px; }
    a { display: block; margin: 13px 0; padding: 16px 18px; border-radius: 13px; color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; transition: transform .15s, opacity .15s; }
    a:hover { transform: translateY(-2px); opacity: .9; }
    .pdf { background: #d89b18; }
    .instagram { background: linear-gradient(110deg, #833ab4, #fd1d1d, #fcb045); }
    .facebook { background: #1877f2; }
    footer { margin-top: 22px; color: #9aa6ba; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo-acam.png" alt="Logo ACAM">
    <h1>CSA ACAM</h1>
    <p class="subtitle">Retrouvez tous nos liens officiels</p>
    <a class="pdf" href="https://files.manuscdn.com/user_upload_by_module/session_file/310419663031445447/ZveQXDNnlFxhOJNY.pdf" target="_blank" rel="noopener">Télécharger le formulaire d’inscription</a>
    <a class="instagram" href="https://www.instagram.com/club.sportif.acam?stkn=cnF5dTg1bDl3cmxu&utm_source=qr" target="_blank" rel="noopener">Instagram</a>
    <a class="facebook" href="https://www.facebook.com/share/195ivLeSwt/?mibextid=wwXIfr" target="_blank" rel="noopener">Facebook</a>
    <footer>Scannez le QR code pour accéder à cette page</footer>
  </main>
</body>
</html>
