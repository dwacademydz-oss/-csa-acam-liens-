<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSA ACAM — Liens officiels</title>
<style>
  :root{
    --navy:#0d3b8c;
    --navy-dark:#092a66;
    --gold:#c8952a;
    --bg:#eef1f8;
    --text:#1a1f2b;
    --muted:#5b6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,#dfe6f5,#eef1f8 40%);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(20,30,60,.12);
    padding:36px 28px 30px;
    text-align:center;
  }
  .card img{
    width:150px;
    height:auto;
    margin-bottom:14px;
  }
  h1{
    margin:0 0 4px;
    font-size:1.7rem;
    color:var(--navy-dark);
    font-weight:800;
  }
  p.subtitle{
    margin:0 0 26px;
    color:var(--muted);
    font-size:1.05rem;
  }
  a.link-btn{
    display:block;
    text-decoration:none;
    padding:16px 18px;
    border-radius:14px;
    font-weight:700;
    font-size:1.05rem;
    margin-bottom:14px;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
  }
  a.link-btn:active{
    transform:scale(0.98);
  }
  .btn-pdf{ background:linear-gradient(135deg,#c8952a,#a9781a); }
  .btn-online{ background:linear-gradient(135deg,var(--navy),var(--navy-dark)); }
  .btn-instagram{ background:linear-gradient(135deg,#8134af,#e0562f,#f7a23d); }
  .btn-facebook{ background:#1877f2; }
  .qr-note{
    margin-top:22px;
    font-size:.85rem;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <img src="logo-acam.png" alt="Logo CSA ACAM">
    <h1>CSA ACAM</h1>
    <p class="subtitle">Retrouvez tous nos liens officiels</p>

    <a class="link-btn btn-pdf" href="https://files.manuscdn.com/user_upload_by_module/session_file/310419663031445447/ZveQXDNnlFxhOJNY.pdf" target="_blank" rel="noopener">
      Télécharger le formulaire d'inscription
    </a>

    <a class="link-btn btn-online" href="inscription.html">
      Remplir le formulaire en ligne
    </a>

    <a class="link-btn btn-instagram" href="https://www.instagram.com/club.sportif.acam?stkn=cnF5dTg1bDl3cmxu&utm_source=qr" target="_blank" rel="noopener">
      Instagram
    </a>

    <a class="link-btn btn-facebook" href="https://www.facebook.com/share/195ivLeSwt/?mibextid=wwXIfr" target="_blank" rel="noopener">
      Facebook
    </a>

    <p class="qr-note">Scannez le QR code pour accéder à cette page</p>
  </div>
</body>
</html>
